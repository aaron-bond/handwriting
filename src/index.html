<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Handwriting</title>
    <base href="/" />
    <!-- viewport-fit=cover: lets content draw under a notch/status bar
         instead of leaving a dead bar there - needed for fullscreen/
         black-translucent below to actually look full-bleed rather than
         just moving the blank gap from the top of the screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Andika&amp;family=Dancing+Script:wght@700&amp;family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#4dabf7" />
    <!-- iOS ignores the manifest's icons/name - Safari only picks up
         "Add to Home Screen" branding from these tags. -->
    <link rel="apple-touch-icon" href="icons/icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Handwriting" />
    <!-- iOS has no true fullscreen for home-screen web apps - this is
         the closest it gets, an overlaid/see-through status bar rather
         than a hidden one. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
