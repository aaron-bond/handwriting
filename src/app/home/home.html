<div class="tiles">
  @for (workbook of workbooks; track workbook.id) {
    <button
      type="button"
      class="tile"
      [style.--accent]="workbook.color.accent"
      [style.--accent-dark]="workbook.color.accentDark"
      [style.--accent-soft]="workbook.color.accentSoft"
      (click)="selectWorkbook.emit(workbook)"
    >
      <span class="tile-icon">{{ workbook.icon }}</span>
      <span class="tile-title">{{ workbook.title }}</span>
      <span class="tile-meta">{{ workbook.items.length }} {{ workbook.itemLabel }}</span>
    </button>
  }

  <button
    type="button"
    class="tile"
    [style.--accent]="customColor.accent"
    [style.--accent-dark]="customColor.accentDark"
    [style.--accent-soft]="customColor.accentSoft"
    (click)="selectCustom.emit()"
  >
    <span class="tile-icon">✏️</span>
    <span class="tile-title">Custom Word</span>
    <span class="tile-meta">Type your own</span>
  </button>
</div>
